# Windows has its own line endings, shell and pnpm shims, and problems there do not show on a Mac.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:browser
      - run: pnpm test:compression
      # A build must leave the checkout clean, or the next `mografy update` is blocked.
      - name: Checkout stays clean after a build
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then echo "$status"; exit 1; fi

  # A real `mografy update` on Windows, twice in a row: a local bare repository stands in for GitHub.
  windows-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update twice from a local upstream
        shell: bash
        run: scripts/windows-update-sandbox.sh
